name: Keep MedAssist Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping MedAssist Backend
        env:
          MEDASSIST_BACKEND_URL: ${{ secrets.MEDASSIST_BACKEND_URL || vars.MEDASSIST_BACKEND_URL }}
        run: |
          curl -f --max-time 30 "$MEDASSIST_BACKEND_URL/health"
